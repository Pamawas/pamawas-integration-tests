name: Integration Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Cross-Component E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pamawas
          POSTGRES_PASSWORD: pamawas
          POSTGRES_DB: pamawas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pamawas -d pamawas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4
        with:
          path: integration-tests

      - name: Checkout pamawas-ingest
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-ingest
          path: pamawas-ingest
          ref: dev

      - name: Checkout pamawas-correlator
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-correlator
          path: pamawas-correlator
          ref: dev

      - name: Checkout pamawas-investigator
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-investigator
          path: pamawas-investigator
          ref: dev

      - name: Checkout pamawas-reporter
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-reporter
          path: pamawas-reporter
          ref: dev

      - name: Checkout pamawas-scheduler
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-scheduler
          path: pamawas-scheduler
          ref: dev

      - name: Checkout pamawas-schema
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-schema
          path: pamawas-schema
          ref: dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Create Go workspace
        run: |
          cd integration-tests
          go work init ../pamawas-ingest ../pamawas-correlator ../pamawas-investigator ../pamawas-reporter ../pamawas-scheduler ../pamawas-schema
          go work use .

      - name: Install Python dependencies
        run: |
          cd pamawas-investigator
          pip install -e .[test]

      - name: Install pg_isready
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run database migrations
        run: |
          cd /github/workspace/pamawas-schema
          # Debug: check if pg_isready is available
          echo "Checking pg_isready..."
          which pg_isready
          pg_isready --version
          
          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            echo "Attempt $i/30: pg_isready -h localhost -p 5432 -U pamawas -d pamawas"
            if pg_isready -h localhost -p 5432 -U pamawas -d pamawas 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done
          # Download dependencies
          go mod download
          # Run migrations with migrate-only mode
          echo "Starting migration runner..."
          go run ./main.go
        env:
          DATABASE_URL: "postgres://pamawas:pamawas@localhost:5432/pamawas?sslmode=disable"
          PAMAWAS_SCHEMA_MIGRATE_ONLY: "true"
          PAMAWAS_SCHEMA_USE_EMBEDDED_MIGRATIONS: "true"

      - name: Run integration tests
        run: |
          cd integration-tests
          go test -v -race -count=1 -timeout 20m ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-tests/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "Integration tests failed. Check GitHub Actions for details."
          # Add Slack/Discord notification here if needed

env:
  DATABASE_URL: "postgres://pamawas:pamawas@localhost:5432/pamawas?sslmode=disable"
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_MODEL: "gpt-4o-mini"
  PROMETHEUS_URL: "http://localhost:9090"
  LOKI_URL: "http://localhost:3100"
  ENVIRONMENT: "test"
  LOG_LEVEL: "debug"