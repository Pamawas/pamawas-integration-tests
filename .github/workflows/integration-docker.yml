name: Integration Tests (Docker Compose)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Cross-Component E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4
        with:
          path: pamawas-integration-tests

      - name: Checkout pamawas-ingest
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-ingest
          path: pamawas-ingest
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-correlator
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-correlator
          path: pamawas-correlator
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-reporter
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-reporter
          path: pamawas-reporter
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: pamawas-integration-tests/go.sum

      - name: Clean Go caches
        run: |
          cd pamawas-integration-tests
          go clean -cache
          go clean -testcache

      - name: Build test binary
        run: |
          cd pamawas-integration-tests
          echo "=== go mod tidy ==="
          go mod tidy 2>&1
          echo "=== go test -c ==="
          go test -c -o /tmp/integration-test -v . 2>&1 | tee /tmp/build.log
          echo "Build log:"
          cat /tmp/build.log
        env:
          CGO_ENABLED: 1

      - name: Start PostgreSQL with docker-compose
        run: |
          cd pamawas-integration-tests
          docker compose up -d --wait

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U pamawas -d pamawas 2>/dev/null; then
              echo "PostgreSQL ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        run: |
          cd pamawas-integration-tests
          DATABASE_URL="postgres://pamawas:pamawas@localhost:5432/pamawas?sslmode=disable" \
          /tmp/integration-test -v -race -count=1 -timeout 10m 2>&1 | tee test-output.json

      - name: Convert test output to JUnit
        if: always()
        run: |
          cd pamawas-integration-tests
          go install github.com/jstemmer/go-junit-report/v2@latest
          /go/bin/go-junit-report < test-output.json > junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            pamawas-integration-tests/junit.xml
            pamawas-integration-tests/test-output.json
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          cd pamawas-integration-tests
          docker compose down -v
