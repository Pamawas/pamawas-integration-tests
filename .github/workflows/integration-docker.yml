name: Integration Tests (Docker Compose)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Cross-Component E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4
        with:
          path: pamawas-integration-tests

      - name: Checkout pamawas-ingest
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-ingest
          path: pamawas-ingest
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-correlator
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-correlator
          path: pamawas-correlator
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-investigator
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-investigator
          path: pamawas-investigator
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-scheduler
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-scheduler
          path: pamawas-scheduler
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-reporter
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-reporter
          path: pamawas-reporter
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-schema
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-schema
          path: pamawas-schema
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: pamawas-integration-tests/go.sum

      - name: Clean Go module cache
        run: go clean -modcache

      - name: Verify workspace structure
        run: |
          ls -la
          echo "=== pamawas-integration-tests/go.mod ==="
          cat pamawas-integration-tests/go.mod

      - name: Build test binary
        run: |
          cd pamawas-integration-tests
          echo "=== Current go.mod ==="
          cat go.mod
          echo "=== Go env ==="
          go env GOMODCACHE
          go test -c -o /tmp/integration-test -v .
        env:
          CGO_ENABLED: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start services with docker-compose
        run: |
          cd pamawas-integration-tests
          docker compose up -d --wait

      - name: Wait for services to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U pamawas -d pamawas 2>/dev/null; then
              echo "PostgreSQL ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          for port in 8080 8081 8082 8083 8084; do
            for i in {1..15}; do
              if curl -sf "http://localhost:$port/healthz" >/dev/null; then
                echo "Service on port $port ready"
                break
              fi
              echo "Waiting for port $port... ($i/15)"
              sleep 2
            done
          done

      - name: Run integration tests
        run: |
          DATABASE_URL="postgres://pamawas:pamawas@localhost:5432/pamawas?sslmode=disable" \
          INGEST_URL="http://localhost:8080" \
          CORRELATOR_URL="http://localhost:8081" \
          INVESTIGATOR_URL="http://localhost:8082" \
          SCHEDULER_URL="http://localhost:8083" \
          REPORTER_URL="http://localhost:8084" \
          LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
          /tmp/integration-test -v -race -count=1 -timeout 20m -json 2>&1 | tee test-output.json
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Convert test output to JUnit
        if: always()
        run: |
          cd pamawas-integration-tests
          go install github.com/jstemmer/go-junit-report/v2@latest
          /go/bin/go-junit-report < test-output.json > junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            pamawas-integration-tests/junit.xml
            pamawas-integration-tests/test-output.json
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          cd pamawas-integration-tests
          docker compose down -v