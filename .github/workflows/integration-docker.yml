name: Integration Tests (Docker Compose)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Cross-Component E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4

      - name: Checkout pamawas-ingest
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-ingest
          path: pamawas-ingest
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-correlator
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-correlator
          path: pamawas-correlator
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-investigator
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-investigator
          path: pamawas-investigator
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-scheduler
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-scheduler
          path: pamawas-scheduler
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-reporter
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-reporter
          path: pamawas-reporter
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pamawas-schema
        uses: actions/checkout@v4
        with:
          repository: Pamawas/pamawas-schema
          path: pamawas-schema
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy component sources to build context
        run: |
          cp -r pamawas-ingest ./
          cp -r pamawas-correlator ./
          cp -r pamawas-investigator ./
          cp -r pamawas-scheduler ./
          cp -r pamawas-reporter ./
          cp -r pamawas-schema ./

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built GHCR images
        run: |
          docker compose pull postgres pamawas-schema pamawas-ingest pamawas-correlator pamawas-investigator pamawas-scheduler pamawas-reporter || echo "Some images not found, will be pulled during up"
        continue-on-error: true

      - name: Run docker-compose integration tests
        run: |
          docker compose up --build --abort-on-container-exit integration-tests
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results/
            *.xml
            *.out
            *.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v