name: Integration Tests (Docker Compose)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Cross-Component E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          docker compose version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built GHCR images
        run: |
          docker compose pull postgres pamawas-schema pamawas-ingest pamawas-correlator pamawas-investigator pamawas-scheduler pamawas-reporter

      - name: Run docker-compose integration tests
        run: |
          docker compose up --build --abort-on-container-exit integration-tests
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            *.xml
            *.out
            *.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v