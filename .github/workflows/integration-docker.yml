name: Integration Tests (Docker Compose)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Cross-Component E2E Tests
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4

      - name: Run docker-compose integration tests
        run: |
          docker-compose up --build --abort-on-container-exit integration-tests
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-tests/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker-compose down -v