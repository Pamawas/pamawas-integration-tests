# docker-compose.yml for pamawas-integration-tests
# Only PostgreSQL is required — the test creates its own schema and uses
# fake transports for all external providers (Discord, Telegram, Investigator API).
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pamawas
      POSTGRES_PASSWORD: pamawas
      POSTGRES_DB: pamawas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamawas -d pamawas"]
      interval: 10s
      timeout: 5s
      retries: 5
